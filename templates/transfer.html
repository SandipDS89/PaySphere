{% extends "base.html" %}
{% block content %}

<h2>Transfer Money</h2>
<p>Your Account: {{ account.account_number }} — Balance: ₹{{ "%.2f"|format(account.balance) }}</p>

<form method="POST" action="/transfer" style="max-width: 400px;">
    <div class="mb-3">
        <label class="form-label">Destination Account Number</label>
        <input type="text" name="account_number" class="form-control" placeholder="e.g. PS100002" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Amount to Transfer (₹)</label>
        <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Transfer</button>
    <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
</form>

{% endblock %}
